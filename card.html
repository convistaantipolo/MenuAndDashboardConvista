<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Rewards Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --brand:#E8731C; --ink:#241A14; --paper:#F3F4F1;
    --muted:rgba(36,26,20,.62); --line:rgba(36,26,20,.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:400 16px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:440px;margin:0 auto;padding:20px 18px 40px}
  .brand{display:flex;align-items:baseline;gap:8px;margin:4px 2px 18px}
  .brand b{font-weight:800;font-size:20px;letter-spacing:-.01em}
  .brand span{color:var(--brand);font-weight:500;font-size:14px}

  .card{position:relative;background:var(--ink);color:#fff;border-radius:22px;padding:22px 22px 20px;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;background:var(--brand)}
  .who{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:rgba(255,255,255,.72)}
  .who strong{color:#fff;font-weight:600;font-size:16px}
  .qr-row{display:flex;align-items:center;gap:16px;margin-top:18px}
  .qr{background:#fff;border-radius:12px;padding:8px;width:112px;height:112px;flex:none}
  .qr svg{display:block;width:100%;height:100%}
  .qr-row p{margin:0;font-size:13px;color:rgba(255,255,255,.72)}
  .code{font-weight:600;color:#fff;font-size:15px;letter-spacing:.06em;display:block;margin-bottom:4px}

  h2{font-size:17px;font-weight:600;margin:28px 2px 10px}
  .prog{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin-bottom:12px}
  .prog.ready{border:2px solid var(--brand)}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .prog-name{font-weight:600;font-size:17px}
  .prog-count{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .prog-count small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
  .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 12px}
  .dots i{aspect-ratio:1/1;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal}
  .dots i.on{background:var(--brand);border-color:var(--brand)}
  .dots i.free{border-style:dashed;font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1}
  .dots i.free.on{border-style:solid;color:#fff}
  .meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 12px}
  .meter i{display:block;height:100%;background:var(--brand)}
  .prog-note{font-size:14px;color:var(--muted)}
  .lvl{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle;background:#F6E1D0}
  .lvl.Silver{background:#E9EBEE}.lvl.Gold{background:#FBEFC8}
  .collect{font-size:13px;color:var(--muted);margin:4px 0 0}
  .ladder{list-style:none;margin:8px 0 0;padding:0;font-size:14px;line-height:1.35}
  .ladder li{padding:4px 8px;border-radius:8px;color:var(--muted)}
  .ladder li.cur{background:rgba(36,26,20,.06);color:var(--ink);font-weight:600}
  .prog.ready .prog-note{color:var(--ink);font-weight:600}

  .hist{list-style:none;margin:0;padding:0}
  .hist li{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
  .hist small{display:block;color:var(--muted);font-size:13px}
  .hist .amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hist .neg{color:var(--muted)}
  .hist .undone{text-decoration:line-through;color:var(--muted)}
  .empty{color:var(--muted);font-size:15px;padding:6px 2px}

  .lookup{padding:28px 4px}
  .lookup h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
  .lookup p{color:var(--muted);margin:0 0 20px}
  .lookup label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
  .lookup input{width:100%;font:600 20px Poppins,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  .lookup input:focus{outline:none;border-color:var(--brand)}
  .lookup button,.again{display:block;width:100%;margin-top:12px;min-height:52px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:600 16px Poppins,system-ui,sans-serif;cursor:pointer}
  .again{background:transparent;color:var(--ink);border:1.5px solid var(--line);text-align:center;line-height:48px;text-decoration:none}
  .err{color:#B3261E;font-size:14px;min-height:21px;margin:10px 0 0}
  .saved{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .saved a{display:inline-block;margin-top:6px;color:var(--ink);font-weight:600}
  .tip{margin-top:28px;font-size:13px;color:var(--muted);padding:0 2px}
  .msg{text-align:center;padding:80px 10px}
  .msg h1{font-size:22px;margin:0 0 8px}
  .msg p{color:var(--muted);margin:0}
  .skeleton{height:280px;border-radius:22px;background:var(--line);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}

  /* ===== playful layer ===== */
  body{background:
    radial-gradient(circle at 12% -4%, color-mix(in srgb, var(--brand) 16%, transparent) 0 140px, transparent 141px),
    radial-gradient(circle at 105% 30%, rgba(46,125,79,.10) 0 120px, transparent 121px),
    var(--paper)}
  .brand{align-items:center}
  .brand img{width:44px;height:44px;border-radius:50%;object-fit:contain;animation:bob 3.2s ease-in-out infinite;flex:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}

  .card{animation:rise .5s cubic-bezier(.2,.9,.3,1.3) both}
  .prog{animation:rise .55s cubic-bezier(.2,.9,.3,1.3) both;box-shadow:0 6px 0 rgba(36,26,20,.06)}
  .prog:nth-of-type(2){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}

  .prog-count{display:inline-block}
  .prog-count.pop{animation:pop .45s ease-out}
  @keyframes pop{40%{transform:scale(1.25)}}

  /* stamp slots */
  .dots{gap:10px}
  .dots i{position:relative;border:2px dashed rgba(36,26,20,.18);background:rgba(255,255,255,.6);color:rgba(36,26,20,.28);font:600 13px Poppins,sans-serif}
  .dots i.on{border:0;background:transparent}
  .dots i.on img,.dots i.on .mark{position:absolute;inset:-3%;width:106%;height:106%;border-radius:50%;
    transform:rotate(var(--r,0deg));box-shadow:0 2px 0 rgba(0,0,0,.18);
    animation:thud .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
  .dots i.on img{object-fit:cover;background:#fff}
  .dots i.on .mark{background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
  @keyframes thud{
    0%{opacity:0;transform:scale(2.2) rotate(calc(var(--r,0deg) - 25deg))}
    60%{opacity:1;transform:scale(.88) rotate(var(--r,0deg))}
    100%{transform:scale(1) rotate(var(--r,0deg))}}
  .dots i.free{border:2px dashed var(--brand);color:var(--brand);font-size:17px;background:#fff}
  .dots i.free{flex-direction:column}
  .dots i.free span{display:block;font-size:8.5px;font-weight:700;line-height:1;margin-top:1px;letter-spacing:-.01em}
  .dots i.free.on{background:var(--brand);color:#fff;border-style:solid;animation:wiggle 1.4s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) scale(1.08)}20%{transform:rotate(10deg) scale(1.08)}30%{transform:rotate(-6deg)}40%{transform:rotate(0)}}

  .prog.ready{border:2px solid var(--brand);animation:rise .55s cubic-bezier(.2,.9,.3,1.3) both, glow 2s ease-in-out .6s infinite}
  @keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--brand) 18%, transparent),0 6px 0 rgba(36,26,20,.06)}}
  .ready-tag{display:inline-block;margin-top:10px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;animation:wiggle 2.4s ease-in-out infinite}

  .lvl.Gold{background:linear-gradient(110deg,#F7DD8B 30%,#FFF6D6 50%,#F7DD8B 70%);background-size:220% 100%;animation:shine 2.6s linear infinite}
  @keyframes shine{to{background-position:-120% 0}}
  .ladder li.cur{position:relative;padding-right:92px}
  .ladder li.cur::after{content:"you are here";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--brand);font-weight:700}

  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

  /* ===== interactive card: tilt + flip ===== */
  .flip{perspective:1000px;touch-action:pan-y;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .flip:focus-visible .face{box-shadow:0 0 0 3px var(--brand)}
  .flipper{position:relative;transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--fy,0deg)));
    transition:transform .75s cubic-bezier(.2,.9,.25,1.15)}
  .flip.moving .flipper{transition:transform .08s linear}
  .flip.flipped .flipper{--fy:180deg}
  .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:214px;animation:none!important}
  .flip{animation:rise .5s cubic-bezier(.2,.9,.3,1.3) both}
  .face.back{position:absolute;inset:0;transform:rotateY(180deg);background:#fff;color:var(--ink);border:2px solid var(--ink);
    padding:16px 18px 14px 26px;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column}
  .face.back::before{background:var(--brand)}
  .face.back h3{margin:0 0 6px;font-size:15px;font-weight:800}
  .face.back ul{list-style:none;margin:0;padding:0}
  .face.back li{margin:0 0 6px;padding-left:12px;text-indent:-12px}
  .face.back .thanks{margin-top:auto;padding-top:8px;border-top:2px solid var(--brand);font-weight:600;font-size:12px}
  .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:var(--go,0);transition:opacity .3s;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.2), rgba(255,255,255,0) 50%)}
  .face.front::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:var(--go,0);transition:opacity .3s;
    background:linear-gradient(115deg,transparent 20%,color-mix(in srgb, var(--brand) 16%, transparent) 40%,rgba(120,220,160,.12) 55%,transparent 75%);
    background-size:200% 200%;background-position:var(--hx,50%) 50%;mix-blend-mode:screen}
  .flip-hint{display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin:10px 0 0}
  .flip-hint b{color:var(--brand)}

  /* ===== tappable stamps ===== */
  .dots i{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dots i.on.spin img,.dots i.on.spin .mark{animation:spin .7s cubic-bezier(.3,1.5,.5,1)}
  @keyframes spin{0%{transform:rotate(var(--r,0deg)) scale(1)}35%{transform:rotate(calc(var(--r,0deg) + 200deg)) scale(1.28)}100%{transform:rotate(calc(var(--r,0deg) + 360deg)) scale(1)}}
  .dots i.nope{animation:nope .4s}
  @keyframes nope{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .dots i.free.boing{animation:boing .6s cubic-bezier(.3,1.8,.5,1)}
  @keyframes boing{30%{transform:scale(1.35) rotate(-8deg)}}
  .spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:60;animation:spark .6s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .bubble{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:90vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.18);animation:bubble .25s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes bubble{from{transform:translate(-50%,14px);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<main id="app"><div class="skeleton" aria-label="Loading your card"></div></main>

<script>
/* ===== CONFIG ===== */
const CONFIG = {
  SUPABASE_URL: 'https://zmcalfrnhmhjjpjlpleh.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptY2FsZnJuaG1oampwamxwbGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mzc1NjQsImV4cCI6MjEwMzMxMzU2NH0.LqxMPTlNnwVuaO5cZ5j-bbQSJmL96Vwlsg1fUrtI7qA'
};

function rpc(fn, args){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open('POST', CONFIG.SUPABASE_URL + '/rest/v1/rpc/' + fn);
    x.setRequestHeader('apikey', CONFIG.SUPABASE_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_KEY);
    x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){
      var d = null; try { d = JSON.parse(x.responseText); } catch(e){}
      if (x.status >= 200 && x.status < 300) resolve(d);
      else reject(new Error((d && d.message) || ('HTTP ' + x.status)));
    };
    x.onerror = function(){ reject(new Error('network')); };
    x.send(JSON.stringify(args || {}));
  });
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtCode(c){ return c.slice(0,2) + ' ' + c.slice(2,6) + ' ' + c.slice(6); }
function fmtDate(iso){
  return new Date(iso).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function plural(n, w){ return n + ' ' + w + (Math.abs(n) === 1 ? '' : 's'); }
function qrSvg(text){
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4, margin:0, scalable:true});
}
function theme(b){
  var r = document.documentElement.style;
  if (b.color_primary) r.setProperty('--brand', b.color_primary);
  if (b.color_ink) r.setProperty('--ink', b.color_ink);
  if (b.color_paper) r.setProperty('--paper', b.color_paper);
  document.querySelector('meta[name=theme-color]').content = b.color_ink || '#241A14';
}
function message(title, body){
  document.getElementById('app').innerHTML = '<div class="msg"><h1>' + esc(title) + '</h1><p>' + esc(body) + '</p></div>';
}

function ordinal(n){ var v = n % 100; return n + (v >= 11 && v <= 13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th')); }

/* each client’s card design, with the same defaults as the staff app */
var DEFAULT_HOW = [
  'Complete a card, claim your reward, and start a new card to level up.',
  '🏆 Reached Gold? Every completed card after that earns the Gold reward again!',
  '📲 Ask any staff member to check your rewards progress.'
];
function cardDesign(b){
  var c = (b && b.card) || {};
  function pick(k, d){ return c[k] != null ? c[k] : d; }
  return {
    title_accent: pick('title_accent', 'Rewards Card'),
    subtitle: pick('subtitle', 'Show this QR every time you order to earn your stamps.'),
    stamp_logo: c.stamp_logo !== false,
    back_how: Array.isArray(c.back_how) ? c.back_how : DEFAULT_HOW,
    back_thanks: pick('back_thanks', 'Thank you for being a valued customer!')
  };
}

function histLabel(h){
  var n = h.program_name || '';
  if (h.kind === 'scan') return (n ? n + ' ' : '') + 'purchase';
  if (h.kind === 'redeem') return 'Claimed ' + (h.note || n);
  if (h.kind === 'adjust') return (n ? n + ' ' : '') + 'points adjusted';
  if (h.kind === 'undo') return (n ? n + ' ' : '') + 'purchase reversed';
  return h.kind;
}

var LOGO = '', STAMP_LOGO = true;
var LV_ICON = {Bronze:'🥉', Silver:'🥈', Gold:'🥇'};
function progIcon(name){ return /tower|cocktail/i.test(name) ? '🍹' : (/coffee/i.test(name) ? '☕' : '⭐'); }
function progHtml(b){
  var ready = b.points >= b.cost, vis;
  if (b.cost <= 19) {
    vis = '<div class="dots" aria-hidden="true">';
    for (var i = 0; i < b.cost; i++) {
      if (i < b.points) {
        var rot = ((i * 37 + b.cost * 11) % 17) - 8;               // fixed "hand-stamped" tilt
        var st = 'style="--r:' + rot + 'deg;--d:' + (0.25 + i * 0.12).toFixed(2) + 's"';
        vis += '<i class="on">' + (LOGO && STAMP_LOGO ? '<img src="' + LOGO + '" alt="" ' + st + '>' : '<b class="mark" ' + st + '>✓</b>') + '</i>';
      } else {
        vis += '<i>' + (i + 1) + '</i>';
      }
    }
    vis += '<i class="free' + (ready ? ' on' : '') + '">🎁<span>' + ordinal(b.cost + 1) + ' FREE</span></i></div>';
  } else {
    vis = '<div class="meter"><i style="width:' + Math.min(100, Math.round(b.points / b.cost * 100)) + '%"></i></div>';
  }
  var left = b.cost - b.points;
  var lvl = b.level || 'Bronze', rw = b.rewards || {};
  var note = ready ? 'Your ' + lvl + ' reward is ready: ' + b.reward_name + '. Show this card at the counter to claim it.'
             : b.points === 0 ? 'Your first stamp is one order away! Collect ' + b.cost + ' for your ' + lvl + ' reward: ' + b.reward_name + '.'
             : left <= 2 ? 'So close! Just ' + left + ' more ' + (left === 1 ? 'stamp' : 'stamps') + ' for your ' + lvl + ' reward: ' + b.reward_name + '.'
             : left + ' more ' + (left === 1 ? 'stamp' : 'stamps') + ' to unlock your ' + lvl + ' reward: ' + b.reward_name + '.';
  var ladder = '<ul class="ladder">' + ['Bronze','Silver','Gold'].map(function(l){
    return '<li class="' + (l === lvl ? 'cur' : '') + '">' + LV_ICON[l] + ' <b>' + l + ':</b> ' + esc(rw[l] || '') + '</li>'; }).join('') + '</ul>';
  return '<section class="prog' + (ready ? ' ready' : '') + '" aria-label="' + esc(b.name) + ' card">' +
    '<div class="prog-top"><span class="prog-name">' + progIcon(b.name) + ' ' + esc(b.name) + '<span class="lvl ' + esc(lvl) + '">' + LV_ICON[lvl] + ' ' + esc(lvl) + '</span></span>' +
    '<span class="prog-count" data-to="' + b.points + '">0<small> / ' + b.cost + '</small></span></div>' + vis +
    '<div class="prog-note">' + esc(note) + '</div>' + (ready ? '<span class="ready-tag">🎉 Reward ready!</span>' : '') + ladder + '</section>';
}

function render(data){
  var b = data.brand, c = data.card, d = cardDesign(b);
  theme(b);
  LOGO = b.logo || ''; STAMP_LOGO = d.stamp_logo;
  document.title = b.name + ' ' + (d.title_accent || 'Rewards Card');
  var link = location.origin + location.pathname + '?c=' + encodeURIComponent(c.code);

  var progs = c.balances.length ? c.balances.map(progHtml).join('') : '<p class="empty">Rewards will appear here soon.</p>';

  var hist = c.history.length ? '<ul class="hist">' + c.history.map(function(h){
    var amt = (h.points > 0 ? '+' : '') + h.points;
    return '<li class="' + (h.undone ? 'undone' : '') + '"><span>' + esc(histLabel(h)) +
      '<small>' + esc(fmtDate(h.created_at)) + '</small></span>' +
      '<span class="amt' + (h.points < 0 ? ' neg' : '') + '">' + esc(amt) + '</span></li>';
  }).join('') + '</ul>' : '<p class="empty">No purchases yet. Show your QR at the counter when you order.</p>';

  document.getElementById('app').innerHTML =
    '<div class="brand">' + (LOGO ? '<img src="' + LOGO + '" alt="">' : '') + '<b>' + esc(b.name) + '</b><span>' + esc(b.tagline || '') + '</span></div>' +
    '<div class="flip" id="flip" tabindex="0" role="button" aria-pressed="false" aria-label="Your rewards card. Tap to flip it over.">' +
      '<div class="flipper">' +
        '<section class="card face front">' +
          '<div class="glare"></div>' +
          '<div class="who"><strong>' + esc(c.name || d.title_accent || 'Rewards Card') + '</strong><span>' + esc(c.mobile || '') + '</span></div>' +
          '<div class="qr-row"><div class="qr" aria-hidden="true">' + qrSvg(link) + '</div>' +
          '<p><span class="code">' + esc(fmtCode(c.code)) + '</span>' + esc(d.subtitle) + '</p></div>' +
        '</section>' +
        '<section class="card face back" aria-hidden="true">' +
          '<h3>How It Works</h3><ul>' + d.back_how.map(function(l){ return '<li>• ' + esc(l) + '</li>'; }).join('') + '</ul>' +
          (d.back_thanks ? '<p class="thanks">' + esc(d.back_thanks) + '</p>' : '') +
        '</section>' +
      '</div>' +
    '</div>' +
    '<p class="flip-hint">✨ <span>Tilt it, <b>tap to flip</b>, and tap your stamps!</span></p>' +
    '<h2>Your rewards</h2>' + progs +
    '<h2>Recent activity</h2>' + hist +
    '<p class="tip">Tip: add this page to your home screen so your card is always one tap away.</p>' +
    '<a class="again" href="card.html?brand=' + encodeURIComponent(b.id) + '">Check a different card</a>';
  celebrate(c);
  wirePlay();
}

var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(c){
  [].forEach.call(document.querySelectorAll('.prog-count'), function(el, k){
    var to = +el.dataset.to, small = el.querySelector('small').outerHTML;
    if (REDUCED || !to) { el.innerHTML = to + small; return; }
    var n = 0, step = Math.max(60, Math.min(140, 1100 / to));
    setTimeout(function tick(){
      n++; el.innerHTML = n + small;
      if (n < to) setTimeout(tick, step); else el.classList.add('pop');
    }, 300 + k * 120);
  });
  if (!REDUCED && c.balances.some(function(b){ return b.points >= b.cost; })) setTimeout(confetti, 900);
}
/* ===== play: tilt + flip card, tappable stamps ===== */
function wirePlay(){
  var flip = document.getElementById('flip');
  if (flip) {
    var startX = 0, startY = 0, down = false, moved = false;
    var setTilt = function(cx, cy){
      if (REDUCED) return;
      var r = flip.getBoundingClientRect();
      var px = Math.min(1, Math.max(0, (cx - r.left) / r.width)), py = Math.min(1, Math.max(0, (cy - r.top) / r.height));
      var st = flip.style;
      st.setProperty('--ry', ((px - .5) * 26).toFixed(1) + 'deg');
      st.setProperty('--rx', ((.5 - py) * 20).toFixed(1) + 'deg');
      st.setProperty('--gx', (px * 100).toFixed(0) + '%'); st.setProperty('--gy', (py * 100).toFixed(0) + '%');
      st.setProperty('--hx', (px * 100).toFixed(0) + '%'); st.setProperty('--go', '1');
    };
    var reset = function(){ ['--rx','--ry'].forEach(function(k){ flip.style.setProperty(k, '0deg'); }); flip.style.setProperty('--go','0'); flip.classList.remove('moving'); };
    var toggle = function(){
      var on = !flip.classList.contains('flipped');
      flip.classList.toggle('flipped', on); flip.setAttribute('aria-pressed', on);
      flip.querySelector('.front').setAttribute('aria-hidden', on); flip.querySelector('.back').setAttribute('aria-hidden', !on);
      buzz(15);
    };
    flip.addEventListener('pointerdown', function(e){ down = true; moved = false; startX = e.clientX; startY = e.clientY; flip.classList.add('moving'); setTilt(e.clientX, e.clientY); });
    flip.addEventListener('pointermove', function(e){
      if (e.pointerType === 'mouse' || down) { flip.classList.add('moving'); setTilt(e.clientX, e.clientY); }
      if (down && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) moved = true;
    });
    flip.addEventListener('pointerup', function(){ if (down && !moved) toggle(); down = false; reset(); });
    flip.addEventListener('pointercancel', function(){ down = false; reset(); });
    flip.addEventListener('pointerleave', function(){ down = false; reset(); });
    flip.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  }

  [].forEach.call(document.querySelectorAll('.prog'), function(sec){
    [].forEach.call(sec.querySelectorAll('.dots i'), function(slot, idx){
      slot.addEventListener('click', function(){
        if (slot.classList.contains('free')) {
          restart(slot, 'boing');
          if (slot.classList.contains('on')) { sparks(slot, 18); confetti(); say('🎉 Your reward is ready! Show this card at the counter to claim it.'); }
          else { sparks(slot, 8); say('🎁 Your free reward lives here. Fill all the stamps to unlock it!'); }
          buzz(30); return;
        }
        if (slot.classList.contains('on')) {
          restart(slot, 'spin'); sparks(slot, 12); buzz(20);
          var n = idx + 1;
          say(n === 1 ? '⭐ Stamp #1: where it all began!' : '🎉 Stamp #' + n + ' of ' + (sec.querySelectorAll('.dots i').length - 1) + '. Keep them coming!');
        } else {
          restart(slot, 'nope'); buzz(8);
          say('Not yet! Stamp #' + (idx + 1) + ' is waiting for your next order.');
        }
      });
    });
  });
}
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(function(){ el.classList.remove(cls); }, 800); }
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
function brandColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#E8731C'; }
function sparks(el, n){
  if (REDUCED) return;
  var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var cols = [brandColor(),'#F2C14E','#2E7D4F','#F59E62'];
  for (var i = 0; i < n; i++) {
    var p = document.createElement('i'); p.className = 'spark';
    var a = (Math.PI * 2 * i) / n + Math.random() * .4, d = 28 + Math.random() * 30;
    p.style.left = (cx - 4) + 'px'; p.style.top = (cy - 4) + 'px'; p.style.background = cols[i % cols.length];
    p.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px'); p.style.setProperty('--dy', (Math.sin(a) * d).toFixed(0) + 'px');
    document.body.appendChild(p);
    setTimeout(function(x){ return function(){ x.remove(); }; }(p), 700);
  }
}
var bubbleTimer;
function say(text){
  var b = document.querySelector('.bubble');
  if (!b) { b = document.createElement('div'); b.className = 'bubble'; b.setAttribute('role','status'); document.body.appendChild(b); }
  else { b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }
  b.textContent = text;
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(function(){ b.remove(); }, 2400);
}
function confetti(){
  var box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden','true');
  var cols = [brandColor(),'#2E7D4F','#F2C14E','#241A14','#F59E62'];
  for (var i = 0; i < 70; i++) {
    var p = document.createElement('i');
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * .6) + 's';
    p.style.transform = 'rotate(' + Math.round(Math.random() * 360) + 'deg)';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 4200);
}

var SAVED_KEY = 'qrp_my_card';
function savedCard(){ try { return localStorage.getItem(SAVED_KEY) || ''; } catch(e){ return ''; } }
function cleanCode(v){
  v = String(v || '').trim();
  try { var u = new URL(v); var c = u.searchParams.get('c'); if (c) v = c; } catch(e){}
  return v.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
}
/* lookup page: uses the client’s logo and code prefix when opened with ?brand=their-id */
function showLookup(errMsg, brand){
  var mine = savedCard(), logo = brand && brand.logo, pf = (brand && brand.code_prefix) || 'XX';
  if (brand) theme(brand);
  document.title = (brand ? brand.name + ': ' : '') + 'Check your Rewards Card';
  document.getElementById('app').innerHTML =
    '<div class="lookup">' + (logo ? '<img src="' + logo + '" alt="' + esc(brand.name) + '" style="width:72px;height:72px;border-radius:50%;object-fit:contain;margin-bottom:14px;animation:bob 3.2s ease-in-out infinite">' : '') +
    '<h1>Check your stamps</h1>' +
    '<p>Type the code printed on your Rewards Card (for example ' + esc(pf) + ' DEHE JRU). You can also just scan the QR on your card with your phone camera.</p>' +
    '<label for="code">Card code</label><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="' + esc(pf) + ' XXXX XXX">' +
    '<p class="err" id="err" role="alert">' + esc(errMsg || '') + '</p>' +
    '<button id="go">Show my card</button>' +
    (mine ? '<div class="saved">Last card opened on this phone:<br><a href="?c=' + encodeURIComponent(mine) + '">' + esc(fmtCode(mine)) + ' →</a></div>' : '') +
    '</div>';
  var input = document.getElementById('code');
  function go(){
    var c = cleanCode(input.value);
    if (c.length < 6) { document.getElementById('err').textContent = 'Enter the full code from your card.'; input.focus(); return; }
    location.search = '?c=' + encodeURIComponent(c);
  }
  document.getElementById('go').addEventListener('click', go);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
}
function lookupWithBrand(errMsg){
  var id = new URLSearchParams(location.search).get('brand');
  if (!id) { showLookup(errMsg, null); return; }
  rpc('qrp_brand', {p_brand: id}).then(function(b){ showLookup(errMsg, b); }).catch(function(){ showLookup(errMsg, null); });
}

(function init(){
  var code = cleanCode(new URLSearchParams(location.search).get('c'));
  if (!code) { lookupWithBrand(); return; }
  rpc('qrp_public_card', {p_code: code}).then(function(d){
    if (!d || !d.card) { lookupWithBrand('We couldn’t find card ' + fmtCode(code) + '. Check the code on your card and try again.'); return; }
    try { localStorage.setItem(SAVED_KEY, d.card.code); } catch(e){}
    render(d);
  }).catch(function(e){
    message('Couldn\u2019t load your card', e.message === 'network' ? 'Check your internet connection and refresh.' : 'Please refresh in a moment.');
  });
})();
</script>
