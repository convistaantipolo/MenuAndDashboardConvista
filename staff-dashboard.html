<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff Dashboard</title>
<style>
  :root{
    --brand-primary:#FF741F;
    --brand-dark:#1c1917;
    --brand-bg:#f5f5f4;
    --brand-card:#ffffff;
    --brand-border:#e7e5e4;
    --brand-muted:#78716c;
    --brand-radius:14px;
    --col-pending:#f59e0b;
    --col-preparing:#3b82f6;
    --col-completed:#16a34a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--brand-bg); color:var(--brand-dark); }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input{ font-family:inherit; font-size:16px; }
  h1,h2,p{ margin:0; }
  .hidden{ display:none !important; }
  .card{ background:var(--brand-card); border-radius:var(--brand-radius); }
  .badge{ border-radius:999px; font-size:11px; font-weight:700; padding:2px 10px; display:inline-block; }
  .badge-green{ background:#dcfce7; color:#15803d; }
  .badge-red{ background:#fee2e2; color:#b91c1c; }

  header{ position:sticky; top:0; z-index:20; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-size:17px; font-weight:700; }
  #liveStatus{ font-size:12px; color:#a8a29e; }
  #refreshBtn{ font-size:14px; font-weight:600; padding:6px 12px; border-radius:8px; background:#f0efee; }

  main{ display:flex; gap:12px; overflow-x:auto; padding:12px; scroll-snap-type:x mandatory; }
  .col{ flex-shrink:0; width:85vw; scroll-snap-align:start; display:flex; flex-direction:column; gap:12px; }
  .col-title{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
  .dot{ width:10px; height:10px; border-radius:999px; }
  .col-count{ color:#a8a29e; font-weight:400; }
  .order-list{ display:flex; flex-direction:column; gap:12px; }
  .empty-col{ font-size:12px; color:#a8a29e; font-style:italic; padding:16px 0; text-align:center; }
  .completed-caption{ font-size:13px; font-weight:700; color:var(--col-completed); padding:2px 0 6px; }
  .prep-timer-row{ font-size:13px; font-weight:700; color:var(--col-preparing); padding:2px 0 6px; font-variant-numeric:tabular-nums; }
  .prep-timer-row.prep-timer-done{ color:var(--brand-muted); font-weight:600; }

  @media (min-width:900px){
    main{ display:grid; grid-template-columns:1fr 1fr 1fr; overflow-x:visible; }
    .col{ width:auto; }
  }

  .order-card{ box-shadow:0 1px 2px rgba(0,0,0,.06); border:1px solid var(--brand-border); padding:12px; }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
  .order-number{ font-weight:700; font-size:13px; color:var(--brand-primary); margin-bottom:2px; }
  .order-who{ font-weight:700; font-size:14px; }
  .order-time{ font-size:11px; color:#a8a29e; }
  .order-items{ border-top:1px solid #f0efee; border-bottom:1px solid #f0efee; padding:6px 0; margin:6px 0; }
  .order-item-row{ display:flex; justify-content:space-between; font-size:12px; padding:2px 4px; border-radius:4px; }
  .order-item-row.item-row-drink{ background:#dbeafe; }
  .order-item-row .p{ color:var(--brand-muted); }
  .totals-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--brand-muted); padding:1px 0; }
  .order-bottom{ display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-top:4px; }
  .action-btn{ width:100%; margin-top:8px; padding:9px; border-radius:8px; font-size:13px; font-weight:700; color:#fff; }
  .action-btn.undo{ color:var(--brand-muted); background:#f0efee; font-weight:600; padding:7px; font-size:12px; }
  .completed-actions{ display:flex; gap:8px; margin-top:8px; }
  .completed-actions .action-btn{ margin-top:0; flex:1; width:auto; }
  .action-btn.close-btn{ color:#b91c1c; background:#fee2e2; font-weight:600; padding:7px; font-size:12px; }
</style>
</head>
<body>

<div id="dashboard">
  <header>
    <div>
      <h1>Kitchen / Order Board</h1>
      <p id="liveStatus">Loading…</p>
    </div>
    <button id="refreshBtn" onclick="loadOrders()">↻ Refresh</button>
  </header>

  <main>
    <section class="col">
      <h2 class="col-title"><span class="dot" style="background:var(--col-pending)"></span> Pending <span id="count-new" class="col-count">(0)</span></h2>
      <div id="col-new" class="order-list"></div>
    </section>
    <section class="col">
      <h2 class="col-title"><span class="dot" style="background:var(--col-preparing)"></span> Preparing <span id="count-preparing" class="col-count">(0)</span></h2>
      <div id="col-preparing" class="order-list"></div>
    </section>
    <section class="col">
      <h2 class="col-title"><span class="dot" style="background:var(--col-completed)"></span> Completed <span id="count-served" class="col-count">(0)</span></h2>
      <div id="col-served" class="order-list"></div>
    </section>
  </main>
</div>

<script>
/* ======================================================================
   SUPABASE CONFIG — talks to Supabase's REST API using XMLHttpRequest.
   Deliberately not using fetch()/an SDK — see customer-order.html for why.
   ====================================================================== */
const SUPABASE_URL = 'https://zmcalfrnhmhjjpjlpleh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptY2FsZnJuaG1oampwamxwbGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mzc1NjQsImV4cCI6MjEwMzMxMzU2NH0.LqxMPTlNnwVuaO5cZ5j-bbQSJmL96Vwlsg1fUrtI7qA';
const REST_URL = SUPABASE_URL + '/rest/v1';

function restRequest(path, method, body, extraHeaders) {
  return new Promise(function (resolve) {
    try {
      const xhr = new XMLHttpRequest();
      xhr.open(method || 'GET', REST_URL + path, true);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Content-Type', 'application/json');
      if (extraHeaders) {
        Object.keys(extraHeaders).forEach(function (k) { xhr.setRequestHeader(k, extraHeaders[k]); });
      }
      xhr.timeout = 15000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          let data = null;
          try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (e) { /* leave data null */ }
          resolve({ data: data, error: null });
        } else {
          const bodyText = xhr.responseText ? (' — ' + xhr.responseText.slice(0, 200)) : '';
          resolve({ data: null, error: 'HTTP ' + xhr.status + ' ' + xhr.statusText + bodyText });
        }
      };
      xhr.onerror = function () {
        resolve({ data: null, error: 'Network error — request could not reach Supabase. Check your internet connection.' });
      };
      xhr.ontimeout = function () {
        resolve({ data: null, error: 'Request timed out after 15s.' });
      };
      xhr.send(body ? JSON.stringify(body) : null);
    } catch (e) {
      resolve({ data: null, error: 'Exception — ' + ((e && e.message) || String(e)) });
    }
  });
}

const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ======================================================================
   No PIN gate — this page loads straight into the dashboard. Access
   control instead relies on this URL not being shared or linked from
   the customer-facing app. boot() is called at the very end of this
   script, once everything it depends on has been declared.
   ====================================================================== */

/* ======================================================================
   ORDER LOADING
   ====================================================================== */
const STATUS_COLS = ['new', 'preparing', 'served'];
let ORDERS = [];
let pollTimer = null;
let tickTimer = null;

async function loadOrders() {
  const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
  const path = '/orders?select=*&created_at=gte.' + encodeURIComponent(since) + '&order=created_at.desc';
  const { data, error } = await restRequest(path, 'GET');

  if (error) {
    document.getElementById('liveStatus').textContent = 'Load error: ' + error;
    console.error('Order load error:', error);
    return;
  }
  ORDERS = data || [];
  document.getElementById('liveStatus').textContent = 'Updated ' + new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
  renderBoard();
}

async function updateOrderStatus(id, newStatus) {
  const order = ORDERS.find(o => o.id === id);
  const payload = { status: newStatus };
  const nowIso = new Date().toISOString();

  if (newStatus === 'preparing' && order && order.status === 'new') {
    payload.accepted_at = nowIso;
  }
  if (newStatus === 'served') {
    payload.completed_at = nowIso;
  }
  if (newStatus === 'preparing' && order && order.status === 'served') {
    payload.completed_at = null;
  }

  const path = '/orders?id=eq.' + encodeURIComponent(id);
  const { error } = await restRequest(path, 'PATCH', payload, { 'Prefer': 'return=minimal' });
  if (error) { console.error('Update error:', error); alert('Could not update order:\n' + error); return; }
  if (order) Object.assign(order, payload);
  renderBoard();
}

async function closeOrder(id) {
  if (!confirm("Remove this completed order from the board? This can't be undone.")) return;
  const path = '/orders?id=eq.' + encodeURIComponent(id);
  const { error } = await restRequest(path, 'DELETE', null, { 'Prefer': 'return=minimal' });
  if (error) { console.error('Delete error:', error); alert('Could not remove order:\n' + error); return; }
  ORDERS = ORDERS.filter(o => o.id !== id);
  renderBoard();
}

/* ======================================================================
   RENDER BOARD
   ====================================================================== */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderBoard() {
  STATUS_COLS.forEach(status => {
    const list = ORDERS.filter(o => o.status === status);
    document.getElementById('count-' + status).textContent = `(${list.length})`;
    document.getElementById('col-' + status).innerHTML = list.length
      ? list.map(orderCard).join('')
      : `<p class="empty-col">No orders</p>`;
  });
  updatePrepTimers();
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  return hrs + 'h ' + (mins % 60) + 'm ago';
}

const DRINK_CATEGORIES = new Set([
  'Cocktails and Beers', 'Classic Coffees', 'Cafe Frappe', 'Matcha Edition',
  'Non-Coffee Drinks', 'Other Drinks', 'Towers'
]);
function isDrinkCategory(cat) { return DRINK_CATEGORIES.has(cat); }

function orderCard(o) {
  const items = Array.isArray(o.items) ? o.items : [];
  const itemsHtml = items.map(it => `<div class="order-item-row ${isDrinkCategory(it.category) ? 'item-row-drink' : ''}">
      <span>${it.qty}× ${escapeHtml(it.name)}${isDrinkCategory(it.category) ? ' ☕' : ''}</span>
    </div>`).join('');
  const who = o.order_type === 'dine-in' ? `Table ${escapeHtml(o.table_number || '—')}` : escapeHtml(o.customer_name || '—');
  const paidBadge = o.paid
    ? `<span class="badge badge-green">PAID</span>`
    : `<span class="badge badge-red">UNPAID</span>`;

  let actionBtn = '';
  if (o.status === 'new') {
    actionBtn = `<button onclick="updateOrderStatus('${o.id}','preparing')" class="action-btn" style="background:var(--col-preparing)">Accept</button>`;
  } else if (o.status === 'preparing') {
    actionBtn = `<button onclick="updateOrderStatus('${o.id}','served')" class="action-btn" style="background:var(--col-completed)">Complete</button>`;
  } else {
    actionBtn = `
      <div class="completed-actions">
        <button onclick="updateOrderStatus('${o.id}','preparing')" class="action-btn undo">Undo</button>
        <button onclick="closeOrder('${o.id}')" class="action-btn close-btn">Close</button>
      </div>`;
  }

  const timerHtml = o.status === 'preparing' && o.accepted_at
    ? `<p class="prep-timer-row">⏱ <span class="prep-timer" data-accepted="${o.accepted_at}">00:00</span></p>`
    : o.status === 'served'
      ? `<p class="prep-timer-row prep-timer-done">⏱ Prep time: ${o.accepted_at && o.completed_at ? formatDuration(new Date(o.completed_at) - new Date(o.accepted_at)) : '—'}</p>`
      : '';

  return `
    <div class="card order-card">
      <div class="order-top">
        <div>
          <p class="order-number">${formatOrderNumber(o.order_number)}</p>
          <p class="order-who">${labelType(o.order_type)} · ${who}</p>
          <p class="order-time">${timeAgo(o.created_at)}</p>
        </div>
        ${paidBadge}
      </div>
      ${o.status === 'served' ? `<p class="completed-caption">${praiseForOrder(o.order_number)}</p>` : ''}
      ${timerHtml}
      <div class="order-items">${itemsHtml || '<span style="font-size:12px;color:#a8a29e;">No items</span>'}</div>
      <div class="order-bottom">
        <span>${escapeHtml(o.payment_method || '—')}</span>
      </div>
      ${actionBtn}
    </div>`;
}
function formatDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function updatePrepTimers() {
  document.querySelectorAll('.prep-timer[data-accepted]').forEach(el => {
    const acceptedAt = el.getAttribute('data-accepted');
    if (!acceptedAt) return;
    el.textContent = formatDuration(Date.now() - new Date(acceptedAt).getTime());
  });
}
function labelType(t){ return { 'dine-in':'Dine-In', 'takeout':'Takeout', 'pickup':'Pickup' }[t] || (t || 'Order'); }
function formatOrderNumber(n) { return n == null ? '—' : 'CV-' + String(n).padStart(6, '0'); }

const KITCHEN_PRAISE = [
  'Sa order, hindi ka sinayang — good job, chef! 🍳✨',
  'Parang crush, mabilis kang nag-move on sa next order! 🔥',
  'Wala kang katulad — luto tapos, ang bilis mo pa! 💪',
  'Hindi lahat ng hinihintay, nakakagutom — pero \'to, sulit! Great job! 👏',
  'Kasing sarap ng luto mo, ganyan ka rin ka-solid! 🌟',
  'Panalo tayo dito — walang iyakan, tapos na ang order! 🎉',
  'Parang tamang timing sa pagluluto — walang sunog, walang sayang! Nailed it! ⏱️',
  "'Di man perfect ang buhay, pero 'to, sakto sa timpla! 🍲👍",
  'Order done, parang chef sa TV — ang linis ng galaw! 💯',
  'Sa dami ng pinaghirapan sa kusina, ito na \'yong panalo! Good job, kitchen team! 🍽️🎊'
];
function praiseForOrder(orderNumber) {
  const n = Number(orderNumber) || 0;
  return KITCHEN_PRAISE[n % KITCHEN_PRAISE.length];
}

/* ======================================================================
   POLLING (no websockets — simplest possible, works everywhere)
   ====================================================================== */
function boot() {
  loadOrders();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, 8000);
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(updatePrepTimers, 1000);
}

boot();
</script>
</body>
</html>
