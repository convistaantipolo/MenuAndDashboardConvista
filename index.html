<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CV Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="180x180" href="/staff-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/staff-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/staff-icon-192.png">
<link rel="manifest" href="/staff.webmanifest">
<title>Points scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --brand:#E8731C; --ink:#241A14; --paper:#F3F4F1; --ok:#2E7D4F; --bad:#B3261E;
    --muted:rgba(36,26,20,.62); --line:rgba(36,26,20,.12); --soft:rgba(36,26,20,.05);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:400 16px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  button,input,select{font:inherit;color:inherit}
  input,select{font-size:16px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;min-height:48px}
  .btn.brand{background:var(--brand)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.small{min-height:38px;padding:7px 12px;font-size:14px}
  .btn.danger{background:transparent;color:var(--bad);border:1.5px solid rgba(179,38,30,.3)}
  .btn:disabled{opacity:.5;cursor:default}
  .wide{width:100%}
  .muted{color:var(--muted)}
  .wrap{max-width:560px;margin:0 auto;padding:18px}

  /* top bar */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
  .top .who{flex:1;min-width:0;line-height:1.25}
  .top .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .who span{font-size:13px;color:rgba(255,255,255,.7)}
  .top button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer}
  .top button.on{background:var(--brand)}

  /* login */
  .login{max-width:380px;margin:0 auto;padding:48px 20px}
  .login h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
  .login .tag{color:var(--brand);font-weight:500;margin:4px 0 30px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pin{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:600}
  .err{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:21px}

  /* scanner */
  .reader-box{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:1/1;max-height:62vh;margin:0 auto}
  #reader{width:100%;height:100%}
  #reader video{object-fit:cover!important;width:100%!important;height:100%!important}
  #reader img[alt="Info icon"],#reader__dashboard{display:none!important}
  .reader-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px}
  .frame{position:absolute;inset:16%;border:3px solid var(--brand);border-radius:18px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
  .hint{text-align:center;margin:12px 0 22px;color:var(--muted);font-size:15px}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .results{list-style:none;margin:8px 0 0;padding:0}
  .results li button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer}
  .results small{display:block;color:var(--muted);font-size:13px}
  .section-title{font-size:15px;font-weight:600;margin:22px 0 4px}

  /* which card picker */
  .prog-label{font-size:14px;font-weight:500;margin:0 0 6px;color:var(--muted)}
  .prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:12px}
  .prog button{min-height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:17px;cursor:pointer;color:var(--ink)}
  .prog button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
  .frame-label{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-weight:600;padding:6px 16px;border-radius:99px;z-index:2;font-size:15px;white-space:nowrap}
  .bals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .bals > li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .bals > li.hl{border:2px solid var(--brand)}
  .bal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .cnt{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cnt small{display:inline!important;font-size:14px;font-weight:500;color:var(--muted)}
  .dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
  .dots i.on{background:var(--brand);border-color:var(--brand)}
  .dots i.free{width:auto;border-radius:99px;padding:0 9px;font-style:normal;font-size:11px;font-weight:600;line-height:18px;border-style:dashed;color:var(--muted)}
  .dots i.free.on{color:#fff;border-style:solid}
  .meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
  .meter i{display:block;height:100%;background:var(--brand)}
  .lvl{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);margin-left:6px;vertical-align:middle}
  .lvl.Silver{background:#E9EBEE}.lvl.Gold{background:#FBEFC8}.lvl.Bronze{background:#F6E1D0}
  .ladder{list-style:none;margin:8px 0 2px;padding:0;font-size:13.5px;line-height:1.35}
  .ladder li{display:flex;gap:6px;padding:4px 8px;border-radius:8px;color:var(--muted)}
  .ladder li.cur{background:var(--soft);color:var(--ink);font-weight:600}
  .ladder li.cur::after{content:"current";margin-left:auto;font-size:11px;font-weight:600;color:var(--brand)}
  .collect{font-size:13px;color:var(--muted);margin:2px 0 0}
  .bals small{display:block;color:var(--muted);font-size:14px}
  .bals .btn{margin-top:8px}
  .addrow{display:flex;gap:8px;align-items:center;margin-top:10px}
  .step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;flex:none}
  .step button{width:44px;height:46px;border:0;background:transparent;font-size:22px;font-weight:600;cursor:pointer;color:var(--ink)}
  .step output{min-width:30px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .addrow .btn{flex:1;margin-top:0}

  /* result sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .hero{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
  .hero .big{font-weight:800;font-size:76px;line-height:.85;letter-spacing:-.04em;color:var(--ok);font-variant-numeric:tabular-nums}
  .hero.warn .big{color:var(--brand);font-size:44px}
  .hero.bad .big{color:var(--bad);font-size:44px}
  .hero p{margin:0 0 4px;font-weight:600;font-size:18px;line-height:1.25}
  .cust{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
  .cust b{display:block}
  .cust small{color:var(--muted)}
  .bal{text-align:right;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .bal small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .rlist{list-style:none;margin:6px 0 0;padding:0}
  .rlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rlist small{display:block;color:var(--muted);font-size:13px}
  .actions{display:grid;gap:10px;margin-top:18px}
  .hist{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
  .hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .hist small{display:block;color:var(--muted);font-size:12px}
  .hist .undone{text-decoration:line-through;color:var(--muted)}
  .reg{background:var(--soft);border-radius:16px;padding:4px 14px 14px;margin-top:14px}

  /* admin */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 0;max-width:960px;margin:0 auto;scrollbar-width:none}
  .tabs button{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:99px;font-weight:500;cursor:pointer;color:var(--muted)}
  .tabs button[aria-selected=true]{background:var(--ink);color:#fff}
  .admin{max-width:960px;margin:0 auto;padding:16px 18px 60px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
  .stat{background:#fff;padding:14px 16px}
  .stat b{display:block;font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--muted)}
  .tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:600;font-size:13px;color:var(--muted);background:var(--soft)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--soft)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 18px 18px;margin-bottom:18px;max-width:560px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .note{font-size:14px;color:var(--muted);margin:10px 0 0}
  .pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--soft)}
  .pill.off{color:var(--muted)}
  .pill.m{background:var(--ink);color:#fff}

  dialog{border:0;border-radius:20px;padding:0;width:min(520px,94vw);max-height:90vh;background:var(--paper);color:var(--ink)}
  dialog::backdrop{background:rgba(20,14,10,.5)}
  .dlg{padding:20px}
  .dlg h3{margin:0 0 2px;font-size:20px}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;font-weight:500;max-width:90vw}

  /* print sheet: loyalty-card size (85.6 x 54 mm), fronts page then backs page, 10 per A4 */
  #print{display:none}
  @media print{
    @page{size:A4;margin:8mm}
    body{background:#fff}
    body > *:not(#print){display:none!important}
    body::before{display:none}
    #print{display:block}
    .psheet{display:grid;grid-template-columns:repeat(2,85.6mm);grid-auto-rows:54mm;justify-content:center;align-content:start;break-after:page;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .psheet:last-child{break-after:auto}
    .psheet + .psheet{break-before:page}
    .pc{box-sizing:border-box;width:85.6mm;height:54mm;overflow:hidden;border:0.15mm dashed #bbb;font-family:Poppins,system-ui,sans-serif}
    .pc.blank{border-color:transparent}
    /* front */
    .pf{background:#fff;color:#1d1714;display:flex;align-items:center;gap:3mm;padding:4mm 4mm 4mm 5mm;position:relative;border-left:2mm solid var(--brand)}
    .pf .l{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
    .pf img{width:15mm;height:15mm;display:block}
    .pf .t{font-size:10pt;font-weight:800;line-height:1.08;margin-top:1.8mm}
    .pf .t span{color:var(--brand)}
    .pf .k{font-size:5.4pt;color:#5c524c;margin-top:.8mm;line-height:1.3}
    .pf code{font:600 7.2pt Poppins,sans-serif;letter-spacing:.06em;margin-top:auto;color:#1d1714}
    .pf .q{background:#fff;padding:1mm;flex:none}
    .pf .q svg{display:block;width:32mm;height:32mm}
    /* back */
    .pb{background:#fff;color:#1d1714;padding:2.8mm 3.4mm 2.4mm;font-size:5.1pt;line-height:1.26;display:flex;flex-direction:column}
    .pb .intro{font-weight:700;font-size:5.8pt;text-align:center;margin:0 0 1.3mm;color:#1d1714}
    .pb .cols{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm}
    .pb .rw{border:0.2mm solid #ddd;border-radius:1.2mm;padding:1.1mm 1.4mm}
    .pb h4{margin:0 0 .3mm;font-size:5.6pt;font-weight:800;color:var(--brand)}
    .pb .rw p{margin:0 0 .4mm;color:#555}
    .pb ul{list-style:none;margin:0;padding:0}
    .pb .rw li{margin:.15mm 0}
    .pb .how{margin-top:1.2mm}
    .pb .how b{font-size:5.6pt}
    .pb .how li{margin:.25mm 0;padding-left:1.8mm;text-indent:-1.8mm}
    .pb .thanks{margin:auto 0 0;padding-top:.9mm;border-top:0.3mm solid var(--brand);font-weight:600;text-align:center}
    .pb.simple{justify-content:center;text-align:center;font-size:7pt}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="v-login" hidden>
  <div class="login">
    <h1 id="l-brand">Loading…</h1>
    <p class="tag" id="l-tag"></p>
    <label for="l-pin">Staff PIN</label>
    <input id="l-pin" class="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••">
    <p class="err" id="l-err" role="alert"></p>
    <button class="btn brand wide" id="l-go">Sign in</button>
    <p style="text-align:center;margin-top:28px;font-size:15px">Customer? <a href="card.html" style="color:var(--brand);font-weight:600">Check your stamps →</a></p>
  </div>
</section>

<!-- TOP BAR (scan + admin) -->
<header class="top" id="topbar" hidden>
  <div class="who"><b id="t-brand"></b><span id="t-staff"></span></div>
  <button id="t-scan" class="on">Scan</button>
  <button id="t-admin" hidden>Admin</button>
  <button id="t-out">Sign out</button>
</header>

<!-- SCAN -->
<section id="v-scan" hidden>
  <div class="wrap">
    <div class="reader-box">
      <div id="reader"></div>
      <div class="frame" id="frame" hidden></div>
      <div class="reader-msg" id="cam-msg">
        <p id="cam-text">Starting camera…</p>
        <button class="btn brand" id="cam-start" hidden>Turn on camera</button>
      </div>
    </div>
    <p class="hint" id="scan-hint">Point the camera at the customer’s QR. Each scan adds points automatically.</p>

    <div class="section-title">QR won’t scan?</div>
    <div class="row">
      <input id="m-code" placeholder="Type the card code" autocapitalize="characters" autocomplete="off" aria-label="Card code">
      <button class="btn" id="m-go">Open</button>
    </div>

    <div class="section-title">Find a customer</div>
    <input id="f-q" placeholder="Name, mobile number or code" autocomplete="off" aria-label="Find a customer">
    <ul class="results" id="f-res"></ul>
  </div>
</section>

<!-- ADMIN -->
<section id="v-admin" hidden>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="activity" aria-selected="true">Activity</button>
    <button role="tab" data-tab="customers">Customers</button>
    <button role="tab" data-tab="rewards">Rewards</button>
    <button role="tab" data-tab="staff">Staff</button>
    <button role="tab" data-tab="cards">Print cards</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
  <div class="admin" id="a-body"><p class="muted">Loading…</p></div>
</section>

<!-- RESULT SHEET -->
<div class="scrim" id="sheet-scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div id="print"></div>

<script>
/* ===== CONFIG =====
   BRAND: which brand this deployment is for ('convista' or 'cafe2').
   You can also open index.html?brand=cafe2 to switch without editing. */
const CONFIG = {
  SUPABASE_URL: 'https://zmcalfrnhmhjjpjlpleh.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptY2FsZnJuaG1oampwamxwbGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mzc1NjQsImV4cCI6MjEwMzMxMzU2NH0.LqxMPTlNnwVuaO5cZ5j-bbQSJmL96Vwlsg1fUrtI7qA',
  BRAND: 'convista'
};
const BRAND_ID = new URLSearchParams(location.search).get('brand') || CONFIG.BRAND;
const SKEY = 'qrp_session_' + BRAND_ID;

/* ===== helpers ===== */
const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function plural(n, w){ return n + ' ' + w + (Math.abs(n) === 1 ? '' : 's'); }
function fmtCode(c){ return c ? c.slice(0,2) + ' ' + c.slice(2,6) + ' ' + c.slice(6) : ''; }
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—'; }
function cardUrl(code){ return new URL('card.html?c=' + encodeURIComponent(code), location.href).href; }
function ordinal(n){ var v = n % 100; return n + (v >= 11 && v <= 13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th')); }
function qrSvg(text){ var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); }

var ERR = {
  bad_level:'Pick Bronze, Silver or Gold.',
  points_1_to_50:'Add between 1 and 50 points at a time.',
  session_expired:'Your session ended. Please sign in again.',
  master_only:'Only the master admin can do that.',
  wrong_pin:'That PIN didn’t match. Try again.',
  too_many_attempts:'Too many wrong PINs. Wait 5 minutes and try again.',
  cannot_undo:'This point was already undone.',
  undo_window_passed:'Undo is only available for 15 minutes by the staff who scanned. Ask the master admin to adjust the points.',
  points_already_used:'Those points were already used for a reward, so the scan can’t be undone. Ask the master admin to adjust.',
  not_enough_points:'Not enough points for this reward yet.',
  unknown_program:'That reward card no longer exists. Refresh and pick another one.',
  program_name_required:'Enter the card name, for example Coffee.',
  unknown_card:'That card isn’t registered.',
  unknown_reward:'That reward is no longer available.',
  pin_in_use:'Another staff member already uses that PIN. Pick a different one.',
  pin_4_to_6_digits:'PIN must be 4 to 6 digits.',
  pin_required:'Set a PIN for the new staff member.',
  need_one_master:'Keep at least one active master admin.',
  staff_name_required:'Enter the staff member’s name.',
  reward_name_required:'Enter the free reward, for example Free coffee.',
  reward_cost_required:'Enter how many points the reward costs.',
  would_go_negative:'Points can’t go below zero.',
  points_required:'Enter how many points to add or remove.',
  count_1_to_200:'Create between 1 and 200 cards at a time.',
  network:'No internet connection. Check the Wi-Fi and try again.'
};
function errText(e){
  var m = (e && e.message) || String(e);
  for (var k in ERR) if (m.indexOf(k) !== -1) return ERR[k];
  return 'Something went wrong (' + m + ').';
}

function rpc(fn, args){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open('POST', CONFIG.SUPABASE_URL + '/rest/v1/rpc/' + fn);
    x.setRequestHeader('apikey', CONFIG.SUPABASE_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_KEY);
    x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){
      var d = null; try { d = JSON.parse(x.responseText); } catch(e){}
      if (x.status >= 200 && x.status < 300) resolve(d);
      else reject(new Error((d && d.message) || ('HTTP ' + x.status)));
    };
    x.onerror = function(){ reject(new Error('network')); };
    x.send(JSON.stringify(args || {}));
  });
}
/* authed call: kicks back to login if the session ended */
function api(fn, args){
  args = Object.assign({p_token: S.token}, args || {});
  return rpc(fn, args).catch(function(e){
    if (String(e.message).indexOf('session_expired') !== -1) { signOut(true); }
    throw e;
  });
}

var toastTimer;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 2600);
}
function theme(b){
  if (!b) return;
  var r = document.documentElement.style;
  if (b.color_primary) r.setProperty('--brand', b.color_primary);
  if (b.color_ink) r.setProperty('--ink', b.color_ink);
  if (b.color_paper) r.setProperty('--paper', b.color_paper);
  document.querySelector('meta[name=theme-color]').content = b.color_ink || '#241A14';
}

var scanner = null, camOn = false, busy = false, lastText = '', lastAt = 0;
function camMsg(text, showBtn){
  $('cam-msg').hidden = !text; $('cam-text').textContent = text || '';
  $('cam-start').hidden = !showBtn; $('frame').hidden = !!text;
}
function startCamera(){
  if (camOn) { resumeCamera(); return; }
  if (typeof Html5Qrcode === 'undefined') { camMsg('The scanner didn’t load. Check the internet and refresh, or type the card code below.', false); return; }
  camMsg('Starting camera…', false);
  try { if (!scanner) scanner = new Html5Qrcode('reader', {verbose:false}); } catch(e){ camMsg('Camera isn’t available on this device. Type the card code below.', false); return; }
  scanner.start({facingMode:'environment'}, {fps:10, qrbox:function(w,h){ var s = Math.floor(Math.min(w,h)*0.68); return {width:s, height:s}; }},
    onDecode, function(){}).then(function(){ camOn = true; camMsg('', false); })
    .catch(function(e){
      var m = String(e && (e.name || e.message || e));
      camMsg(/NotAllowed|Permission/i.test(m) ? 'Camera access is blocked. Allow the camera for this site in your browser settings, then tap the button.' : 'The camera couldn’t start. Tap to try again, or type the card code below.', true);
    });
}
function stopCamera(){
  if (scanner && camOn) { scanner.stop().catch(function(){}); camOn = false; }
}
function pauseCamera(){ try { if (scanner && camOn) scanner.pause(true); } catch(e){} }
function resumeCamera(){ try { if (scanner && camOn && scanner.getState && scanner.getState() === 3) scanner.resume(); } catch(e){} }
$('cam-start').addEventListener('click', startCamera);
document.addEventListener('visibilitychange', function(){
  if (document.hidden) stopCamera();
  else if (!$('v-scan').hidden && $('sheet-scrim').hidden) startCamera();
});

function parseCode(text){
  text = String(text || '').trim();
  try { var u = new URL(text); var c = u.searchParams.get('c'); if (c) return c.toUpperCase(); } catch(e){}
  return text.replace(/\s+/g,'').toUpperCase();
}
function onDecode(text){
  var now = Date.now();
  if (busy || !$('sheet-scrim').hidden) return;
  if (text === lastText && now - lastAt < 4000) return;
  lastText = text; lastAt = now;
  openCard(parseCode(text));
}
$('m-go').addEventListener('click', function(){
  var c = parseCode($('m-code').value); if (!c) return;
  openCard(c); $('m-code').value = '';
});
$('m-code').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('m-go').click(); });

function programs(){ return (S && S.brand && S.brand.programs) || []; }
function progById(id){ return programs().filter(function(p){ return p.id === id; })[0]; }

  $('scan-hint').textContent = programs().length

var cur = null;  // {status, card, event_id, added, program_id, program_name, minutes_ago}
var qty = {};
function addPoints(programId){
  if (busy || !cur || !cur.card) return;
  var n = qty[programId] || 1, code = cur.card.code;
  busy = true;
  api('qrp_add_points', {p_code: code, p_program_id: programId, p_points: n}).then(function(r){
    cur = r; qty = {};
    if (navigator.vibrate) navigator.vibrate(60);
    renderSheet();
  }).catch(function(e){ alert(errText(e)); }).then(function(){ busy = false; });
}
function openCard(code){
  if (!code || busy) return;
  qty = {};
  busy = true; pauseCamera();
  api('qrp_card', {p_code: code}).then(function(c){
    cur = c ? {status:'view', card:c} : {status:'unknown', code:code};
    renderSheet();
  }).catch(function(e){ if (S) { cur = {status:'error', message: errText(e)}; renderSheet(); } })
    .then(function(){ busy = false; });
}

function histLabel(x){
  var n = x.program_name || '';
  if (x.kind === 'scan') return (n ? n + ' ' : '') + 'point';
  if (x.kind === 'redeem') return 'Claimed ' + (x.note || n);
  if (x.kind === 'undo') return 'Undo ' + n;
  if (x.kind === 'adjust') return (n ? n + ' ' : '') + 'adjusted' + (x.note ? ': ' + x.note : '');
  if (x.kind === 'register') return 'Saved details';
  return x.kind;
}
function histHtml(h){
  if (!h || !h.length) return '<p class="muted" style="font-size:14px">No activity yet.</p>';
  return '<ul class="hist">' + h.map(function(x){
    return '<li class="' + (x.undone ? 'undone' : '') + '"><span>' + esc(histLabel(x)) +
      '<small>' + esc(fmtDate(x.created_at)) + [x.staff_name].filter(Boolean).map(function(v){ return ', ' + esc(v); }).join('') + '</small></span>' +
      '<b>' + (x.points > 0 ? '+' : '') + x.points + '</b></li>';
  }).join('') + '</ul>';
}
var LV_ICON = {Bronze:'🥉', Silver:'🥈', Gold:'🥇'};
function progIcon(name){ return /tower|cocktail/i.test(name) ? '🍹' : (/coffee/i.test(name) ? '☕' : '⭐'); }
function progTitle(name){ return progIcon(name) + ' ' + name.toUpperCase() + ' REWARDS'; }
function ladderHtml(b){
  var r = b.rewards || {};
  return '<ul class="ladder">' + ['Bronze','Silver','Gold'].map(function(l){
    return '<li class="' + (l === b.level ? 'cur' : '') + '"><span>' + LV_ICON[l] + ' <b>' + l + ':</b> ' + esc(r[l] || '') + '</span></li>';
  }).join('') + '</ul>';
}
function untilText(b){
  var n = b.cost - b.points;
  return n + ' more ' + (n === 1 ? 'stamp' : 'stamps') + ' until ' + b.level + ': ' + b.reward_name;
}
function dotsHtml(b){
  if (b.cost > 15) {
    return '<div class="meter"><i style="width:' + Math.min(100, Math.round(b.points / b.cost * 100)) + '%"></i></div>';
  }
  var h = '<div class="dots" aria-hidden="true">';
  for (var i = 0; i < b.cost; i++) h += '<i class="' + (i < b.points ? 'on' : '') + '"></i>';
  return h + '<i class="free' + (b.points >= b.cost ? ' on' : '') + '">Free</i></div>';
}
function balancesHtml(c, highlight, withAdd){
  return '<ul class="bals">' + c.balances.map(function(b){
    var ready = b.points >= b.cost;
    var n = qty[b.program_id] || 1, pid = esc(b.program_id);
    return '<li class="' + (b.program_id === highlight ? 'hl' : '') + '"><div class="bal-top"><b>' + esc(progTitle(b.name)) +
      '<span class="lvl ' + esc(b.level) + '">' + LV_ICON[b.level] + ' ' + esc(b.level) + ' card</span></b>' +
      '<span class="cnt">' + b.points + '<small> / ' + b.cost + '</small></span></div>' +
      '<p class="collect">Collect ' + b.cost + ' stamps from qualifying ' + esc(b.name) + ' purchases:</p>' + ladderHtml(b) + dotsHtml(b) +
      (ready ? '<button class="btn brand wide" data-redeem="' + pid + '" data-name="' + esc(b.level + ': ' + b.reward_name) + '" data-cost="' + b.cost + '">Claim ' + LV_ICON[b.level] + ' ' + esc(b.level + ': ' + b.reward_name) + '</button>'
             : '<small>' + esc(untilText(b)) + '</small>') +
      (withAdd ? '<div class="addrow"><div class="step"><button type="button" data-step="' + pid + '" data-d="-1" aria-label="One less">−</button>' +
        '<output aria-live="polite">' + n + '</output><button type="button" data-step="' + pid + '" data-d="1" aria-label="One more">+</button></div>' +
        '<button class="btn" data-addpts="' + pid + '">Add ' + plural(n, 'stamp') + '</button></div>' : '') + '</li>';
  }).join('') + '</ul>';
}

function renderSheet(){
  var r = cur, c = r.card, h = '';
  var bname = esc(S.brand.name);
  if (r.status === 'added') {
    h += '<div class="hero"><span class="big">+' + r.added + '</span><p id="sheet-title">' + esc(r.program_name) + ' ' + (r.added === 1 ? 'stamp' : 'stamps') + ' added</p></div>';
  } else if (r.status === 'cooldown') {
    h += '<div class="hero warn"><span class="big">Wait</span><p id="sheet-title">' + esc(r.program_name) + ' already scanned ' + (r.minutes_ago < 1 ? 'just now' : plural(r.minutes_ago, 'minute') + ' ago') + '</p></div>' +
         '<p class="muted" style="margin:8px 0 0">No point was added. If this is a new ' + esc(r.program_name) + ' purchase, add it anyway.</p>';
  } else if (r.status === 'view') {
    h += '<h2 id="sheet-title" style="margin:0">Choose what to add</h2>';
  } else if (r.status === 'unknown' || r.status === 'other_brand') {
    h += '<div class="hero bad"><span class="big">Not found</span></div>' +
         '<p id="sheet-title" style="font-weight:600">This isn’t a ' + bname + ' points card.</p>' +
         '<p class="muted">Code read: ' + esc(r.code || '') + '. Check that it’s one of your printed cards, or try typing the code.</p>';
  } else {
    h += '<div class="hero bad"><span class="big">Error</span></div><p id="sheet-title">' + esc(r.message) + '</p>';
  }

  if (c) {
    h += '<div class="cust"><div><b>' + esc(c.name || 'New customer') + '</b><small>' + esc(fmtCode(c.code)) + (c.mobile ? ', ' + esc(c.mobile) : '') + '</small></div></div>';
    h += balancesHtml(c, r.program_id, true);
    if (!c.registered) {
      h += '<div class="reg"><div class="section-title">Save customer details (optional)</div>' +
           '<label for="r-name">Name</label><input id="r-name" autocomplete="off">' +
           '<label for="r-mob">Mobile number</label><input id="r-mob" type="tel" inputmode="tel" autocomplete="off" placeholder="09XX XXX XXXX">' +
           '<button class="btn wide" style="margin-top:12px" id="r-save">Save details</button></div>';
    }
  }

  h += '<div class="actions">';
  if (r.status === 'added') h += '<button class="btn ghost" id="s-undo">Undo ' + esc(r.program_name) + ' +' + r.added + '</button>';
  h += '<button class="btn brand" id="s-next">Done, scan next</button>';
  h += '</div>';
  if (c && r.status === 'view') h += '<div class="section-title">History</div>' + histHtml(c.history);

  $('sheet').innerHTML = h;
  $('sheet-scrim').hidden = false;
  var nextBtn = $('s-next'); if (nextBtn) nextBtn.focus({preventScroll:true});
}

function closeSheet(){
  $('sheet-scrim').hidden = true; cur = null; lastText = '';
  if (!$('v-scan').hidden) resumeCamera();
}

$('sheet').addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t) return;
  if (t.id === 's-next') return closeSheet();
  if (t.dataset.step) {
    var k = t.dataset.step; qty[k] = Math.max(1, Math.min(50, (qty[k] || 1) + (+t.dataset.d)));
    return renderSheet();
  }
  if (t.dataset.addpts) return addPoints(t.dataset.addpts);
  if (t.id === 's-undo') {
    if (!confirm('Remove the ' + plural(cur.added, cur.program_name + ' stamp') + ' just added?')) return;
    t.disabled = true;
    return api('qrp_undo', {p_event_id: cur.event_id}).then(function(card){
      cur = {status:'view', card:card}; renderSheet(); toast('Scan undone');
    }).catch(function(err){ t.disabled = false; alert(errText(err)); });
  }
  if (t.id === 'r-save') {
    var name = $('r-name').value.trim(), mob = $('r-mob').value.trim();
    if (!name && !mob) { $('r-name').focus(); return; }
    t.disabled = true;
    return api('qrp_register', {p_code: cur.card.code, p_name: name, p_mobile: mob}).then(function(card){
      cur.card = card; renderSheet(); toast('Customer saved');
    }).catch(function(err){ t.disabled = false; alert(errText(err)); });
  }
  if (t.dataset.redeem) {
    if (!confirm('Give ' + t.dataset.name + '? This uses ' + plural(+t.dataset.cost, 'stamp') + ' and moves the customer up a level.')) return;
    t.disabled = true;
    return api('qrp_redeem', {p_code: cur.card.code, p_program_id: t.dataset.redeem}).then(function(card){
      cur = {status:'view', card:card}; renderSheet(); toast('Claimed ' + t.dataset.name);
    }).catch(function(err){ t.disabled = false; alert(errText(err)); });
  }
});

            return '<td class="num">' + ((c.points || {})[p.id] || 0) + ' / ' + p.cost + ' ' + LV_ICON[lv] + '</td>'; }).join('') +
          '<td>' + esc(c.last_scan_at ? fmtDate(c.last_scan_at) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>' + (list.length ? '' : '<p class="muted">No customer matches that search.</p>')
      : '<p class="muted">No cards yet. Go to Print cards to create your first batch.</p>');
}

/* admin events */
$('a-body').addEventListener('input', function(e){
  if (e.target.id === 'c-q') {
    custQ = e.target.value; var pos = e.target.selectionStart;
    renderAdmin(); var i = $('c-q'); i.focus(); try { i.setSelectionRange(pos, pos); } catch(_){}
  }
});
$('a-body').addEventListener('change', function(e){
});
$('a-body').addEventListener('click', function(e){
  var t = e.target.closest('button, tr.click'); if (!t) return;
  if (t.id === 'a-refresh') return loadAdmin();
  if (t.matches('tr.click')) return customerDialog(t.dataset.code);
  if (t.id === 'nr-add') {
    var name = $('nr-name').value.trim(), cost = parseInt($('nr-cost').value, 10);
    var rb = $('nr-b').value.trim(), rs = $('nr-s').value.trim(), rg = $('nr-g').value.trim();
    if (!name) return $('nr-name').focus(); if (!(cost > 0)) return $('nr-cost').focus(); if (!rb) return $('nr-b').focus();
    return save('program', {name:name, cost:cost, reward_bronze:rb, reward_silver:rs, reward_gold:rg}, 'Reward card added');
  }
  if (t.dataset.deleteProg) return deleteProgram(progById(t.dataset.deleteProg));
  if (t.dataset.editProg) return programDialog(progById(t.dataset.editProg));
  if (t.id === 'ns-add') {
    var n = $('ns-name').value.trim(), p = $('ns-pin').value.trim();
    if (!n) return $('ns-name').focus();
    if (!/^\d{4,6}$/.test(p)) { alert(ERR.pin_4_to_6_digits); return $('ns-pin').focus(); }
    return save('staff', {name:n, pin:p, role:$('ns-role').value, active:true}, 'Staff added');
  }
  if (t.dataset.editStaff) return staffDialog(A.staff.find(function(x){ return x.id === t.dataset.editStaff; }));
  if (t.id === 'pc-go') {
    var k = parseInt($('pc-n').value, 10);
    if (!(k >= 1 && k <= 200)) return alert(ERR.count_1_to_200);
    t.disabled = true;
    return api('qrp_create_cards', {p_count: k}).then(function(codes){
      printCards(codes); toast(plural(codes.length, 'card') + ' created'); loadAdmin();
    }).catch(function(err){ alert(errText(err)); }).then(function(){ t.disabled = false; });
  }
  if (t.id === 'st-save') {
    return save('settings', {
      name:$('st-name').value.trim(), tagline:$('st-tag').value.trim(),
      color_primary:$('st-col').value
    }, 'Settings saved').then(function(){ enterAppLabels(); });
  }
});
function enterAppLabels(){
  $('t-brand').textContent = S.brand.name;
  renderProgPicker();
}

function programDialog(p){
  if (!p) return;
  var r = p.rewards || {};
  openDlg('<h3>Edit ' + esc(p.name) + ' card</h3>' +
    '<div class="grid2"><div><label for="ep-name">Card name</label><input id="ep-name" value="' + esc(p.name) + '"></div>' +
    '<div><label for="ep-cost">Stamps to complete</label><input id="ep-cost" type="number" min="1" value="' + p.cost + '"></div></div>' +
    '<label for="ep-b">🥉 Bronze reward</label><input id="ep-b" value="' + esc(r.Bronze || '') + '">' +
    '<label for="ep-s">🥈 Silver reward</label><input id="ep-s" value="' + esc(r.Silver || '') + '">' +
    '<label for="ep-g">🥇 Gold reward</label><input id="ep-g" value="' + esc(r.Gold || '') + '">' +
    '<div class="actions"><button class="btn brand" id="ep-save">Save</button><button class="btn danger" id="ep-del">Delete this card</button><button class="btn ghost" data-close>Cancel</button></div>');
  $('ep-del').onclick = function(){ deleteProgram(p, true); };
  $('ep-save').onclick = function(){
    var n = $('ep-name').value.trim(), c = parseInt($('ep-cost').value, 10), rb = $('ep-b').value.trim();
    if (!n) return $('ep-name').focus(); if (!(c > 0)) return $('ep-cost').focus(); if (!rb) return $('ep-b').focus();
    save('program', {id:p.id, name:n, cost:c, reward_bronze:rb, reward_silver:$('ep-s').value.trim(), reward_gold:$('ep-g').value.trim()}, 'Reward card saved').then(closeDlg);
  };
}
function deleteProgram(p, fromDialog){
  if (!p) return;
  var st = (A.program_stats || []).filter(function(x){ return x.program_id === p.id; })[0];
  var held = st ? st.points_outstanding : 0;
  if (!confirm('Delete the ' + p.name + ' card?' + (held ? ' Customers will lose their ' + p.name + ' points (' + plural(held, 'point') + ' in total).' : '') + ' Past activity stays in the history. This can’t be undone.')) return;
  api('qrp_delete_program', {p_program_id: p.id}).then(function(d){
    A = d; S.brand = d.brand; saveS(); renderProgPicker(); renderAdmin(); if (fromDialog) closeDlg(); toast(p.name + ' card deleted');
  }).catch(function(e){ alert(errText(e)); });
}
function staffDialog(s){
  openDlg('<h3>Edit ' + esc(s.name) + '</h3>' +
    '<label for="es-name">Name</label><input id="es-name" value="' + esc(s.name) + '">' +

    '<div class="actions"><button class="btn brand" id="es-save">Save staff</button><button class="btn ghost" data-close>Cancel</button></div>');

      '<div><label for="cd-note">Reason</label><input id="cd-note" placeholder="e.g. Missed scan on 12 Oct"></div></div>' +
      '<button class="btn small" style="margin-top:10px" id="cd-adj-go">Apply adjustment</button>' +

      '<div><label for="cd-lv">Level</label><select id="cd-lv"><option value="0">🥉 Bronze</option><option value="1">🥈 Silver</option><option value="2">🥇 Gold</option></select></div></div>' +

      '<p class="note" style="margin-top:2px">Deletes this card’s name, mobile, all stamps, levels and history, and sets both cards back to 0 (Bronze). The QR code itself keeps working, so the card can be given to a new customer. This can’t be undone.</p>' +

      '<div class="actions"><button class="btn ghost" id="cd-print">Print this card</button><a class="btn ghost" target="_blank" rel="noopener" href="' + esc(cardUrl(c.code)) + '">Open customer view</a><button class="btn" data-close>Close</button></div>');
    $('cd-save').onclick = function(){
      api('qrp_register', {p_code:c.code, p_name:$('cd-name').value.trim(), p_mobile:$('cd-mob').value.trim()})
        .then(function(){ toast('Customer saved'); loadAdmin(); customerDialog(c.code); }).catch(function(e){ alert(errText(e)); });
    };
    $('cd-adj-go').onclick = function(){
      var n = parseInt($('cd-adj').value, 10); if (!n) return $('cd-adj').focus();
      var note = $('cd-note').value.trim(); if (!note) return $('cd-note').focus();
      save('adjust', {code:c.code, program_id:$('cd-prog').value, points:n, note:note}, 'Points adjusted').then(function(){ customerDialog(c.code); });
    };
    $('cd-lv-go').onclick = function(){
      save('level', {code:c.code, program_id:$('cd-lp').value, completed:+$('cd-lv').value}, 'Level updated').then(function(){ customerDialog(c.code); });
    };
    $('cd-reset').onclick = function(){
      var typed = prompt('This permanently deletes everything on card ' + fmtCode(c.code) + (c.name ? ' (' + c.name + ')' : '') +
        ': name, mobile, all stamps, levels and history.\n\nType RESET to confirm.');
      if (typed === null) return;
      if (typed.trim().toUpperCase() !== 'RESET') { alert('Not reset. You need to type RESET to confirm.'); return; }
      api('qrp_reset_card', {p_code: c.code}).then(function(d){
        A = d; renderAdmin(); toast('Card ' + fmtCode(c.code) + ' reset to 0'); customerDialog(c.code);
      }).catch(function(e){ alert(errText(e)); });
    };
    $('cd-print').onclick = function(){ printCards([c.code]); };
  }).catch(function(e){ openDlg('<p class="err">' + esc(errText(e)) + '</p><button class="btn ghost" data-close>Close</button>'); });
}

      '<div class="t">' + (CARD_TITLE[BRAND_ID] || esc(b.name) + ' <span>Rewards Card</span>') + '</div>' +
      '<div class="k">' + (CARD_SUBTITLE[BRAND_ID] || 'Show this QR every time you order.') + '</div>' +
      '<code>' + esc(fmtCode(code)) + '</code></div>' +
    '<div class="q">' + qrSvg(cardUrl(code)) + '</div></div>';
}
function cardBack(){
  var back = CARD_BACK[BRAND_ID];
  return back ? '<div class="pc pb">' + back + '</div>'
              : '<div class="pc pb simple"><p>Collect stamps every time you order and unlock free rewards. Show the QR on the other side to our staff.</p></div>';
}
/* Pages alternate: fronts, then backs mirrored left-to-right so they line up
   when printed double-sided (flip on long edge). */
function printCards(codes){
  var html = '';
  for (var i = 0; i < codes.length; i += 10) {
    var chunk = codes.slice(i, i + 10);
    html += '<div class="psheet">' + chunk.map(cardFront).join('') + '</div>';
    var backs = '';
    for (var r = 0; r < chunk.length; r += 2) {
      var left = chunk[r], right = chunk[r + 1];
      backs += (right ? cardBack() : '<div class="pc blank"></div>') + cardBack();
    }
    html += '<div class="psheet">' + backs + '</div>';
  }
  $('print').innerHTML = html;
  setTimeout(function(){ window.print(); }, 300);
}

/* ===== boot ===== */
(function boot(){
  if (S && S.token && S.brand && S.brand.id === BRAND_ID) { enterApp(); }
  else { S = null; show('v-login'); rpc('qrp_brand', {p_brand: BRAND_ID}).then(renderLogin).catch(function(){ renderLogin(null); $('l-err').textContent = ERR.network; }); }
})();
</script>
